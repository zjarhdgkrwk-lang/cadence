[package]
name = "cadence"
version = "0.1.0"
description = "Cadence — Local Music Player"
authors = []
edition = "2021"

[lib]
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
souvlaki = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# 스캔·메타데이터
walkdir = "2"
lofty = "0.22"

# 앨범아트·색상
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kmeans_colors = "0.6"
palette = { version = "0.7", default-features = false, features = ["std"] }

# DB (직접 접근 — scan/commands에서 사용)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# 유틸
sha2 = "0.10"
hex = "0.4"

# 로깅
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Windows 오디오 출력 엔드포인트 감시 (Windows 전용 빌드)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
] }
# HWND를 souvlaki에 전달하기 위해 WebviewWindow에서 raw handle을 추출
raw-window-handle = "0.6"
